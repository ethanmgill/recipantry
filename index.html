<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pantry Snap</title>
  <meta name="description" content="Snap groceries, track your pantry and get recipe ideas with Claude.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121513" media="(prefers-color-scheme: dark)">
  <!-- Install as an app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pantry Snap">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Only allow network calls to ourselves and the Anthropic API. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' https://api.anthropic.com; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="main">
    <section id="view-scan" class="view" hidden></section>
    <section id="view-pantry" class="view" hidden></section>
    <section id="view-recipes" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>

  <!-- First-launch / replace / rejected API key screen -->
  <div id="keyscreen" class="keyscreen" role="dialog" aria-modal="true" aria-labelledby="keyscreen-title" hidden></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="scan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span>Scan</span>
    </button>
    <button data-tab="pantry">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 10h16M4 15h16"/></svg>
      <span>Pantry</span>
    </button>
    <button data-tab="recipes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v2a7 7 0 0 1-14 0zM3 11h18M9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/></svg>
      <span>Recipes</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <noscript><p class="noscript">Pantry Snap needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
